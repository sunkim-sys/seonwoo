  <link rel="stylesheet" href="/css/company-dashboard.css">
</head>
<body>
  <div class="topbar">
    <button id="sidebarToggle" aria-label="메뉴">☰</button>
    <button id="themeToggle" aria-label="테마">🌙</button>
  </div>
  <aside class="sidebar">
    <h1>Web Tools</h1>
    <nav>
      <a href="/">홈</a>
      <a href="/pages/ipgwa.html">입과 템플릿 변환</a>
      <a href="/pages/lecture-info.html">강의 정보 정리</a>
      <a href="/pages/recommend.html">강의 추천</a>
      <a href="/pages/catalog.html">과정 리스트</a>
      <a href="/pages/categorize.html">카테고리 자동 분류</a>
      <a href="/pages/report.html">콘텐츠 현황</a>
      <a href="/pages/result-report.html">결과 보고서</a>
      <a href="/pages/members.html">구성원 다운로드</a>
      <a href="/pages/company-list.html">기업 리스트</a>

      <a href="/pages/doc-logs.html">매뉴얼 접속 로그</a>
    </nav>
  </aside>

  <main class="main dashboard-page-main">
    <h2>기업 현황 대시보드</h2>
    <p class="desc">CSM 담당자별 운영중(ongoing) / 종료(closed) 기업 수 현황입니다.</p>

    <div id="loading" class="loading">데이터를 불러오고 있습니다...</div>
    <div id="errorBox" class="status error" style="display:none;"></div>

    <div id="content" style="display:none;">
      <div class="stat-row">
        <div class="stat-tile">
          <div class="stat-label">총 기업 수</div>
          <div class="stat-value" id="statTotal">-</div>
        </div>
        <div class="stat-tile">
          <div class="stat-label">Ongoing</div>
          <div class="stat-value stat-ongoing" id="statOngoing">-</div>
        </div>
        <div class="stat-tile">
          <div class="stat-label">Closed</div>
          <div class="stat-value stat-closed" id="statClosed">-</div>
        </div>
      </div>

      <div class="chart-card">
        <div class="chart-head">
          <h3>CSM별 담당 기업 수</h3>
          <div class="legend">
            <span class="legend-item"><span class="legend-swatch swatch-ongoing"></span>Ongoing</span>
            <span class="legend-item"><span class="legend-swatch swatch-closed"></span>Closed</span>
          </div>
        </div>
        <div id="csmChart" class="csm-chart"></div>
      </div>

      <div class="table-card">
        <h3>표로 보기</h3>
        <div class="table-wrap">
          <table class="stats-table">
            <thead>
              <tr>
                <th>CSM</th>
                <th>Ongoing</th>
                <th>Closed</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody id="statsTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/layout.js"></script>
  <script src="/js/company-dashboard.js"></script>
</body>
</html>
