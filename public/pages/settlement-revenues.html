  <main class="main catalog-main settle-main">
    <h2>매출 관리</h2>
    <p class="desc">매출(계약)을 등록하고 구독 상품에 매핑합니다.</p>

    <div class="result-row">
      <div class="result-count" id="resultCount"></div>
      <div class="result-actions">
        <button id="addBtn" class="btn-primary" style="padding:10px 18px;">+ 매출 등록</button>
      </div>
    </div>

    <div id="loading" class="loading">데이터를 불러오고 있습니다...</div>
    <div id="errorBox" class="status error" style="display:none;"></div>

    <div class="data-table-wrap" id="tableWrap" style="display:none;">
      <table class="data-table">
        <thead>
          <tr><th>매출 ID</th><th>매출명</th><th>계약 금액</th><th>계약 기간</th><th>연결 상품</th><th></th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </main>

  <div id="formModal" class="modal" style="display:none;">
    <div class="modal-content">
      <button class="modal-close" id="formModalClose">&times;</button>
      <h3 class="modal-name" id="formModalTitle">매출 등록</h3>
      <form id="revenueForm">
        <input type="hidden" id="f_orig_id">
        <div class="input-grid">
          <div class="input-group">
            <label>매출 ID *</label>
            <input type="text" id="f_revenue_id" placeholder="REV-00001" required>
          </div>
          <div class="input-group">
            <label>계약 금액 *</label>
            <input type="number" id="f_contract_amount" min="0" required>
          </div>
          <div class="input-group full-width">
            <label>매출명 *</label>
            <input type="text" id="f_revenue_name" required>
          </div>
          <div class="input-group">
            <label>계약 시작일 *</label>
            <input type="date" id="f_contract_start_date" required>
          </div>
          <div class="input-group">
            <label>계약 종료일 *</label>
            <input type="date" id="f_contract_end_date" required>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" id="deleteBtn" class="btn-danger" style="display:none;">삭제</button>
          <div class="form-actions-right">
            <button type="button" id="cancelBtn" class="btn-secondary">취소</button>
            <button type="submit" class="btn-primary">저장</button>
          </div>
        </div>
      </form>

      <div id="mappingSection" style="display:none; margin-top:20px; padding-top:20px; border-top:1px solid var(--border);">
        <h3 style="font-size:14px; font-weight:700; margin-bottom:10px;">구독 상품 매핑</h3>
        <div id="mappingList"></div>
        <div class="mapping-row">
          <select id="mappingProductSelect"></select>
          <button type="button" class="btn-small primary" id="addMappingBtn">+ 추가</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/layout.js"></script>
  <script src="/js/settlement-revenues.js"></script>
</body>
