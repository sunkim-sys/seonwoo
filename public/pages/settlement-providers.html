  <main class="main catalog-main settle-main">
    <h2>CP사 관리</h2>
    <p class="desc">콘텐츠 제공사(CP)·강사 정보를 관리합니다.</p>

    <div class="result-row">
      <div class="result-count" id="resultCount"></div>
      <div class="result-actions">
        <button id="addBtn" class="btn-primary" style="padding:10px 18px;">+ 등록</button>
      </div>
    </div>

    <div id="loading" class="loading">데이터를 불러오고 있습니다...</div>
    <div id="errorBox" class="status error" style="display:none;"></div>

    <div class="data-table-wrap" id="tableWrap" style="display:none;">
      <table class="data-table">
        <thead>
          <tr><th>ID</th><th>이름</th><th>유형</th><th>이메일</th><th>연락처</th><th>코스 수</th><th></th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </main>

  <div id="formModal" class="modal" style="display:none;">
    <div class="modal-content">
      <button class="modal-close" id="formModalClose">&times;</button>
      <h3 class="modal-name" id="formModalTitle">CP사 등록</h3>
      <form id="providerForm">
        <input type="hidden" id="f_id">
        <div class="input-grid">
          <div class="input-group full-width">
            <label>이름 *</label>
            <input type="text" id="f_name" required>
          </div>
          <div class="input-group">
            <label>유형</label>
            <select id="f_type">
              <option value="individual">개인</option>
              <option value="company">회사</option>
            </select>
          </div>
          <div class="input-group">
            <label>이메일</label>
            <input type="email" id="f_contact_email">
          </div>
          <div class="input-group">
            <label>연락처</label>
            <input type="text" id="f_contact_phone">
          </div>
          <div class="input-group full-width">
            <label>코스 ID들 (쉼표로 구분)</label>
            <input type="text" id="f_course_ids" placeholder="COURSE001, COURSE002">
          </div>
        </div>
        <div class="form-actions">
          <button type="button" id="deleteBtn" class="btn-danger" style="display:none;">삭제</button>
          <div class="form-actions-right">
            <button type="button" id="cancelBtn" class="btn-secondary">취소</button>
            <button type="submit" class="btn-primary">저장</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/layout.js"></script>
  <script src="/js/settlement-providers.js"></script>
</body>
</html>
