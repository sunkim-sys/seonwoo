  <main class="main catalog-main settle-main">
    <h2>상품 관리</h2>
    <p class="desc">Skillflo 수강신청/구독 상품(정산 대상 상품)을 관리합니다.</p>

    <div class="filter-bar">
      <div class="filter-selects">
        <select id="filterType">
          <option value="">전체 유형</option>
          <option value="single">단건</option>
          <option value="subscription">구독</option>
        </select>
        <select id="filterExcluded">
          <option value="">정산 포함/제외 전체</option>
          <option value="false">정산 포함</option>
          <option value="true">정산 제외</option>
        </select>
      </div>
    </div>

    <div class="result-row">
      <div class="result-count" id="resultCount"></div>
      <div class="result-actions">
        <button id="excludeBtn" class="btn-secondary">선택 상품 정산 제외</button>
        <button id="deleteAllBtn" class="btn-danger">전체 삭제</button>
        <button id="addBtn" class="btn-primary" style="padding:10px 18px;">+ 상품 등록</button>
      </div>
    </div>

    <div id="loading" class="loading">데이터를 불러오고 있습니다...</div>
    <div id="errorBox" class="status error" style="display:none;"></div>

    <div class="data-table-wrap" id="tableWrap" style="display:none;">
      <table class="data-table">
        <thead>
          <tr><th><input type="checkbox" id="selectAll"></th><th>상품 ID</th><th>상품명</th><th>유형</th><th>기간</th><th>연결 매출</th><th>정산</th><th></th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </main>

  <div id="formModal" class="modal" style="display:none;">
    <div class="modal-content">
      <button class="modal-close" id="formModalClose">&times;</button>
      <h3 class="modal-name" id="formModalTitle">상품 등록</h3>
      <form id="productForm">
        <input type="hidden" id="f_orig_id">
        <div class="input-grid">
          <div class="input-group">
            <label>상품 ID *</label>
            <input type="text" id="f_product_id" placeholder="19097" required>
          </div>
          <div class="input-group">
            <label>유형</label>
            <select id="f_product_type">
              <option value="single">단건</option>
              <option value="subscription">구독</option>
            </select>
          </div>
          <div class="input-group full-width">
            <label>상품명 *</label>
            <input type="text" id="f_product_name" required>
          </div>
          <div class="input-group">
            <label>시작일 *</label>
            <input type="date" id="f_start_date" required>
          </div>
          <div class="input-group">
            <label>종료일 *</label>
            <input type="date" id="f_end_date" required>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" id="deleteBtn" class="btn-danger" style="display:none;">삭제</button>
          <div class="form-actions-right">
            <button type="button" id="cancelBtn" class="btn-secondary">취소</button>
            <button type="submit" class="btn-primary">저장</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/layout.js"></script>
  <script src="/js/settlement-products.js"></script>
</body>
